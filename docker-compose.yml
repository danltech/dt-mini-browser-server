services:
  mini-server:
    image: ghcr.io/danltech/dt-mini-browser-server:latest
    container_name: dt-mini-server
    restart: unless-stopped
    init: true                      # reaps zombie Chromium processes
    ports:
      - "8080:8080"                 # LAN access. Local only: "127.0.0.1:8080:8080"
    environment:
      # MINI_LOCALE: "en-US"
      # MINI_PORT: "8080"
      # MINI_SHOT: "0"
      # MINI_ALLOW_PRIVATE: "1"     # ⚠️ disables the internal-network protection
      MINI_FALLBACK_LANG: "en"
      # Security (token + optional TLS; files are stored in ./minifiles)
      MINI_SETUP: "1"               # Automatically generate token/certificate/QR if missing
      MINI_SSL: "1"                 # HTTPS with a self-signed certificate
      # MINI_TOKEN: "your-secret-token"  # otherwise, one will be generated and written to minifiles/token.txt
    volumes:
      - mini-data:/data             # cookies/sessions, downloads, debug output
      - ./minifiles:/data/minifiles # Certificate, token, QR codes (qr-setup.png, setup.txt)
    shm_size: "256mb"
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mini-data:
  