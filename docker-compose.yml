services:
  mini-server:
    image: ghcr.io/danltech/dt-mini-browser-server:latest
    container_name: dt-mini-server
    restart: unless-stopped
    init: true                      # reaps zombie Chromium processes
    ports:
      - "8080:8080"                 # LAN access. Local only: "127.0.0.1:8080:8080"
    environment:
      # Address the phone uses to reach the server (LAN IP or domain). Needed for the setup QR code.
      # MINI_PUBLIC_HOST: "192.168.1.50"
      MINI_SETUP: "1"               # Generate token/certificate/QR on first start
      MINI_SSL: "1"                 # HTTPS with a self-signed certificate
      # MINI_TOKEN: "your-secret-token"   # otherwise generated into minifiles/token.txt
      # MINI_LOCALE: "en-US"
      # MINI_ALLOW_PRIVATE: "1"     # WARNING: disables internal-network protection
    volumes:
      - mini-data:/data             # sessions, downloads, debug output
      - ./minifiles:/data/minifiles # token, certificate, QR codes (qr-setup.png, setup.txt)
    shm_size: "256mb"
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mini-data:
